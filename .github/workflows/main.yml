name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Lint with flake8
        run: flake8 .

  docker-build:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t aceest-fitness:latest .

  test:
    name: Automated Testing (in Docker)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .
      - name: Run Pytest inside container
        run: docker run --rm aceest-fitness:test
